# Ставится в /etc/sysctl.d/99-vrcast-net.conf — сетевой тюнинг под раздачу видео.
# Применить: sysctl -p /etc/sysctl.d/99-vrcast-net.conf
# ВАЖНО: net.core.default_qdisc действует только на НОВЫЕ интерфейсы —
# на живом доложить вручную: tc qdisc replace dev <iface> root fq

# BBR вместо cubic: cubic трактует ЛЮБУЮ потерю пакета как затор и режет скорость;
# на Wi-Fi/мобильных потери случайные -> скорость проваливалась зря. BBR меряет
# реальную полосу и RTT и не реагирует на случайные потери.
# (модуль tcp_bbr сам не грузится — см. /etc/modules-load.d/bbr.conf)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Буферы: дефолт wmem_max 208 КБ / tcp_wmem max 4 МБ — мало на 15 зрителей
# по 9-30 Мбит/с через полстраны (большой BDP).
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 16384 16777216

# Не сбрасывать разогнанное окно после паузы: плеер тянет видео рывками
# (Range -> пауза -> следующий), иначе каждый рывок начинался бы со slow start.
net.ipv4.tcp_slow_start_after_idle = 0
