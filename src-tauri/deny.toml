# Проверка лицензий зависимостей на совместимость с GPL-3.0-or-later (T006b, R-01).
# Приложение раздаётся людям, поэтому несовместимая лицензия в дереве зависимостей —
# это юридический дефект, который обязан падать сборку, а не всплывать при раздаче.

[licenses]
allow = [
    # Лицензия самого приложения. Нужна в списке: cargo-deny проверяет и корневой
    # пакет, а «GPL-3.0» и «GPL-3.0-or-later» — разные выражения SPDX, и одно
    # другим не покрывается.
    "GPL-3.0-or-later",
    # webpki-roots: набор корневых сертификатов от Mozilla, приходит вместе
    # с проверкой отдачи по домену (reqwest + rustls). Это лицензия НА ДАННЫЕ,
    # разрешительная и без встречного копилефта, поэтому распространению
    # приложения под GPL не мешает.
    "CDLA-Permissive-2.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
# Несовместимы с GPL-3.0 при распространении.
deny = []

[advisories]
yanked = "deny"

# Известные предупреждения, разобранные поимённо.
#
# Список существует не для того, чтобы заглушить проверку, а чтобы она осталась
# полезной: без разбора каждое новое предупреждение утонуло бы в семнадцати старых,
# и настоящую уязвимость никто бы не заметил. Каждая запись — решение, а не отписка,
# и каждую нужно пересматривать при обновлении зависимостей.
ignore = [
    # --- Единственная настоящая уязвимость в дереве ---
    #
    # RUSTSEC-2023-0071 — атака Marvin: восстановление ключа RSA по времени
    # выполнения. Приходит с `rsa`, который тянет russh ради поддержки ключей RSA.
    #
    # Почему остаёмся. Исправленной версии нет вовсе — не «мы не обновились»,
    # а «обновляться не на что». Отказаться от возможности значит выбросить
    # поддержку ключей RSA, а они до сих пор у многих: ими долгие годы по умолчанию
    # заводил ключи сам ssh-keygen. Сказать такому пользователю «ваш ключ не
    # подходит» — цена выше.
    #
    # Чем это ограничено у нас. Атака требует оракула: множества замеров времени
    # операций с одним и тем же ключом. Приложение подписывает ключом запрос при
    # входе на сервер, который пользователь выбрал сам и чей отпечаток подтвердил
    # вручную; расшифровыванием присланного оно не занимается вовсе.
    #
    # Пересмотреть, как только у `rsa` появится исправленный выпуск.
    "RUSTSEC-2023-0071",

    # --- Пакеты, объявленные неподдерживаемыми ---
    #
    # Все до единого приходят из самого Tauri и его дерева, обновиться на что-либо
    # нельзя. «Не поддерживается» — не уязвимость: это предупреждение о будущем,
    # а не сообщение о дыре. Уйдут вместе с обновлением Tauri.
    #
    # gtk-rs, привязки к GTK3 (только Linux; на Windows этого кода нет вовсе):
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    # proc-macro-error — через дерево сборки Tauri:
    "RUSTSEC-2024-0370",
    # unic-* — разбор Юникода внутри urlpattern, тоже из Tauri:
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
]
