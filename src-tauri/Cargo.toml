[package]
name = "vrcast-studio"
version = "0.1.0"
description = "Управление стриминг-сервером VRCast: библиотека, конвертация, заливка, зрители"
authors = ["VRCast Studio"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.83"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vrcast_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

# Сериализация и договор со слоем интерфейса
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

# Асинхронное исполнение длительных задач (FR-080)
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "process"] }
tokio-util = "0.7.19"
futures = "0.3.34"

# Доступ к серверу: одно соединение с мультиплексированием каналов (R-04).
#
# Криптографический бэкенд — ring, а не умолчательный aws-lc-rs.
# Причина не вкусовая: aws-lc-rs требует ассемблер NASM на Windows и падает без него
# (проверено 2026-08-24). ring везёт заранее собранный ассемблер для MSVC и требует
# только сам компилятор. Приложение под GPL, его будут собирать другие люди — лишний
# обязательный инструмент в списке требований дороже, чем смена бэкенда.
# rsa оставлен: у пользователей встречаются ключи RSA, не только ed25519.
russh = { version = "0.63.1", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2.4.0"

# Проверка отдачи по домену — с машины пользователя, а не с сервера (R-20, FR-125).
# Проверять изнутри сервера бессмысленно: оттуда «работает» и то, что снаружи
# недоступно. Своё шифрование (rustls), а не системное: иначе сборка под Linux
# потребовала бы OpenSSL, а приложение собирают другие люди.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "charset", "http2"] }

# Локальное состояние: задачи, кеш библиотеки, отпечатки (R-09)
rusqlite = { version = "0.40.2", features = ["bundled"] }

# Гарантированное завершение дерева процессов (конституция, принцип III; R-06)
command-group = { version = "5.0.1", features = ["with-tokio"] }

# Прочее
uuid = { version = "1.25.0", features = ["v4", "serde"] }
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
sha2 = "0.11.0"
hex = "0.4.3"
directories = "6.0.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"

# Секреты только в хранилище ОС (конституция, принцип IV; R-07).
# Хранилище своё на каждой платформе, поэтому зависимость объявлена пер-платформенно:
# так на Windows не тянется код Secret Service, а на Linux — код Credential Manager.
[target.'cfg(windows)'.dependencies]
keyring = { version = "4.1.6", features = ["windows-native-keyring-store"] }

[target.'cfg(target_os = "linux")'.dependencies]
# zbus, а не dbus: чистый Rust, не требует libdbus-1-dev на машине сборки и в CI.
keyring = { version = "4.1.6", features = ["zbus-secret-service-keyring-store"] }

# macOS не собирается (отложена), но объявление оставлено, чтобы её добавление
# не требовало переделки — FR-111 запрещает создавать препятствия.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.1.6", features = ["apple-native-keyring-store"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "process"] }
# Тестам схемы нужен прямой доступ к SQL-слою, чтобы проверять правила самой базы.
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Тесты заливки считают контрольную сумму сами — независимо от кода приложения:
# сверять результат тем же средством, которым его получили, значит не проверять ничего.
sha2 = "0.11.0"
hex = "0.4.3"
uuid = { version = "1.25.0", features = ["v4"] }

[features]
# Интеграционные тесты против одноразового контейнера Ubuntu (T026).
# Выключены по умолчанию: требуют Docker и не должны запускаться при обычной сборке.
integration = []
