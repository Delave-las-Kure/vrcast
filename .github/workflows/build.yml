# T005 — сборка и проверки под обе целевые ОС.
#
# macOS сознательно отсутствует: отложена решением владельца 2026-08-23 (см. spec.md, «Вне объёма»).
# Раннер под неё не добавлять — приложение под macOS не собирается и не заявляется.
#
# Файл лежит в репозитории заранее и бездействует, пока не задан удалённый репозиторий.

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Интерфейс — стиль и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  core:
    name: Ядро — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Системные зависимости Tauri (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Формат
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Тесты ядра
        run: cargo test --manifest-path src-tauri/Cargo.toml

  licenses:
    name: Совместимость лицензий с GPL-3.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - name: Проверить лицензии зависимостей ядра
        run: cargo deny --manifest-path src-tauri/Cargo.toml check licenses advisories
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Проверить лицензии зависимостей интерфейса
        run: npx --yes license-checker-rseidelsohn --production --failOn "AGPL-1.0;AGPL-3.0;SSPL-1.0;BUSL-1.1;CC-BY-NC-4.0"

  guards:
    name: Изоляция и отсутствие захардкоженных серверов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Захардкоженные серверы (FR-004)
        env:
          FORBID_IP: ${{ secrets.FORBID_IP }}
          FORBID_DOMAIN: ${{ secrets.FORBID_DOMAIN }}
        run: bash scripts/check-no-hardcoded-server.sh
      # Проверка изоляции (принцип VII) выполняется локально перед сдачей фазы:
      # в CI виден только каталог приложения, а защищаемые файлы лежат вне репозитория.
