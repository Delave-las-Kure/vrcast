# T005 — сборка и проверки под обе целевые ОС.
#
# macOS сознательно отсутствует: отложена решением владельца 2026-08-23 (см. spec.md, «Вне объёма»).
# Раннер под неё не добавлять — приложение под macOS не собирается и не заявляется.
#
# Файл лежит в репозитории заранее и бездействует, пока не задан удалённый репозиторий.

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Интерфейс — стиль и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Без --passWithNoTests: исчезновение всей сюиты (перенос файла мимо маски)
      # обязано быть красным, а не неотличимым от успеха.
      - run: npm run test
      # Продакшен-сборка: tsc --noEmit не ловит поломок, проявляющихся только сборкой.
      - run: npm run build

  core:
    name: Ядро — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Системные зависимости Tauri (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # FFmpeg нужен уже на СБОРКЕ, а не только при упаковке: сборщик Tauri проверяет
      # наличие вложенных программ и отказывается собирать без них. Поэтому шаг стоит
      # во всех заданиях, где вообще собирается ядро, — иначе падает даже `cargo test`.
      #
      # Кладётся в тайник по слепку из scripts/ffmpeg.json: двести восемьдесят мегабайт
      # качаются один раз на версию, дальше берутся готовыми. Заодно это единственное
      # место, где сам сценарий получения проверяется под обе целевые системы.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Тайник вложенного FFmpeg
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/ffmpeg.json') }}
      - name: Положить вложенный FFmpeg
        run: node scripts/fetch-ffmpeg.mjs

      - name: Формат
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Тесты ядра
        run: cargo test --manifest-path src-tauri/Cargo.toml

  integration:
    name: Интеграционные — одноразовый сервер в контейнере
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Системные зависимости Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # FFmpeg нужен уже на СБОРКЕ, а не только при упаковке: сборщик Tauri проверяет
      # наличие вложенных программ и отказывается собирать без них. Поэтому шаг стоит
      # во всех заданиях, где вообще собирается ядро, — иначе падает даже `cargo test`.
      #
      # Кладётся в тайник по слепку из scripts/ffmpeg.json: двести восемьдесят мегабайт
      # качаются один раз на версию, дальше берутся готовыми. Заодно это единственное
      # место, где сам сценарий получения проверяется под обе целевые системы.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Тайник вложенного FFmpeg
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/ffmpeg.json') }}
      - name: Положить вложенный FFmpeg
        run: node scripts/fetch-ffmpeg.mjs

      # Однопоточность обязательна: каждый тест поднимает свой контейнер, и десяток
      # одновременно только замедляет дело.
      - name: Тесты против настоящего OpenSSH
        run: >
          cargo test --manifest-path src-tauri/Cargo.toml
          --features integration --test integration -- --test-threads=1
      - name: Убедиться, что контейнеры за собой убраны
        if: always()
        run: |
          set -o pipefail
          # Метка образа обязана совпадать с IMAGE в tests/integration/fixture.rs.
          #
          # С выдержкой, а не сразу: `docker rm -f` возвращает управление, когда
          # контейнер только помечен к удалению, и секунду-другую он ещё виден
          # в перечне. Проверка без выдержки поймала это 2026-08-25 — сорок четыре
          # теста прошли, страж объявил «остался 1» и тут же показал пустой список.
          # Мигающий страж хуже отсутствующего: он приучает перезапускать сборку,
          # не читая, — и однажды так же перезапустят настоящую утечку.
          for _ in $(seq 1 15); do
            left="$(docker ps -a --filter ancestor=vrcast-test-sshd:2 --format '{{.ID}} {{.Status}}')"
            [ -z "$left" ] && break
            sleep 1
          done
          if [ -n "$left" ]; then
            echo "остались висящие контейнеры:" >&2
            # Печатается ровно то, что было сосчитано, а не новый запрос: иначе
            # сообщение и список расходятся, и разобраться по ним нельзя — ровно
            # это и случилось в тот раз.
            echo "$left" >&2
            exit 1
          fi
          echo "контейнеров не осталось"

  licenses:
    name: Совместимость лицензий с GPL-3.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - name: Проверить лицензии зависимостей ядра
        run: cargo deny --manifest-path src-tauri/Cargo.toml check licenses advisories
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # БЕЛЫЙ список, а не чёрный. Чёрный сравнивается точным совпадением строк,
      # и перечислить в нём все написания («AGPL-3.0» против «AGPL-3.0-only»)
      # — гонка с реальностью, которую не выиграть: проверено, прежний список
      # пропускал «AGPL-3.0-only», ради которого и заводился. Белый список
      # ошибается в безопасную сторону: незнакомая лицензия роняет сборку,
      # и её разбирают глазами.
      - name: Проверить лицензии зависимостей интерфейса
        run: >
          npx --yes license-checker-rseidelsohn --production --excludePrivatePackages
          --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;Unlicense;Python-2.0;BlueOak-1.0.0"
      # Перечень чужих работ обязан отвечать дереву зависимостей. Собранный однажды
      # и забытый, он выглядит выполненным обязательством, не будучи им, — а это
      # хуже отсутствующего файла (T106, обязательство GPL).
      # Исходники нужны целиком: тексты лицензий берутся из них, а не из своего
      # набора образцов — у многих пакетов в файле стоит имя правообладателя.
      - name: Получить исходники зависимостей ядра
        run: cargo fetch --manifest-path src-tauri/Cargo.toml
      - name: Сверить перечень сторонних компонентов с деревом зависимостей
        run: npm run check:third-party

  guards:
    name: Изоляция и отсутствие захардкоженных серверов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Захардкоженные серверы (FR-004)
        env:
          FORBID_IP: ${{ secrets.FORBID_IP }}
          FORBID_DOMAIN: ${{ secrets.FORBID_DOMAIN }}
        run: bash scripts/check-no-hardcoded-server.sh
      # Проверка изоляции (принцип VII) выполняется локально перед сдачей фазы:
      # в CI виден только каталог приложения, а защищаемые файлы лежат вне репозитория.
