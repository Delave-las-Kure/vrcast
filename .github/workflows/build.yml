# T005 — clean GitHub-hosted Windows/Linux checks (owner's decision, 2026-11-01).
# Linux uses the same Debian generation as release.yml, not an owner's local registry.
# macOS remains out of scope. No job needs the owner's server or credential store.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debug symbols/incremental builds exhaust a clean hosted runner's disk; tests still run.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  frontend:
    name: Interface — style, types, tests and production build
    timeout-minutes: 20
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  core:
    name: Core — ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            container: ""
            target: C:/_cargo-target
          - os: linux
            runner: ubuntu-22.04
            container: rust:bookworm
            target: /__w/_cargo-target
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      CARGO_TARGET_DIR: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux build and runtime libraries
        if: runner.os == 'Linux'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libayatana-appindicator3-1 \
            librsvg2-dev patchelf pkg-config git python3 curl unzip xz-utils
      - name: Rust tools
        shell: bash
        run: rustup component add rustfmt clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ matrix.target }}
          key: core-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: core-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}-
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v6
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/ffmpeg.json') }}
      - run: node scripts/fetch-ffmpeg.mjs
      - name: Bundled FFmpeg features
        shell: bash
        run: bash scripts/check-ffmpeg-features.sh
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Clippy, including the integration code on both platforms
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features integration -- -D warnings
      - name: Exercise subtitles without any system fonts or font configuration (Linux)
        if: runner.os == 'Linux'
        # Only inside this disposable job container, never on the owner's machine.
        run: |
          rm -rf /usr/share/fonts /usr/local/share/fonts /etc/fonts /var/cache/fontconfig
          test ! -e /usr/share/fonts && test ! -e /etc/fonts
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  e2e:
    name: End to end — ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            container: ""
            target: C:/_cargo-e2e
          - os: linux
            runner: ubuntu-22.04
            container: rust:bookworm
            target: /__w/_cargo-e2e
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      CARGO_TARGET_DIR: ${{ matrix.target }}
      # WebKit's sandbox cannot initialise as root inside the disposable job container.
      WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: 1
    steps:
      - uses: actions/checkout@v7
      - name: Linux build, runtime and window driver
        if: runner.os == 'Linux'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libayatana-appindicator3-1 \
            librsvg2-dev patchelf pkg-config git python3 curl unzip xz-utils \
            webkit2gtk-driver xvfb xauth dbus-x11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/tauri-driver*
            ${{ matrix.target }}
          key: e2e-${{ runner.os }}-driver-2.0.6-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: e2e-${{ runner.os }}-driver-2.0.6-${{ hashFiles('src-tauri/Cargo.lock') }}-
      - uses: actions/cache@v6
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/ffmpeg.json') }}
      - run: node scripts/fetch-ffmpeg.mjs
      - name: Intermediary driver, pinned
        shell: bash
        run: |
          if ! tauri-driver --version >/dev/null 2>&1; then
            cargo install tauri-driver --version 2.0.6 --locked
          fi
      - name: Build the real application
        run: |
          npm run build
          cargo build --release --features custom-protocol --manifest-path src-tauri/Cargo.toml
      # These are the original non-Docker window checks. The newer video/tour checks need
      # a Docker daemon AND an e2e-feature binary; they are NOT claimed by this job. Windows
      # hosted machines have no Linux Docker daemon. The UI-tour task owns that harness.
      - name: Drive the window (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e -- tests/e2e/app.e2e.ts tests/e2e/forget.e2e.ts
      - name: Drive the window (Linux)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a npm run test:e2e -- tests/e2e/app.e2e.ts tests/e2e/forget.e2e.ts

  integration:
    name: Integration — shard ${{ matrix.shard }} of 8
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    container:
      image: rust:bookworm
      options: -v /var/run/docker.sock:/var/run/docker.sock
    env:
      CARGO_TARGET_DIR: /__w/_cargo-integration
    steps:
      - uses: actions/checkout@v7
      - name: Build libraries and the host Docker client
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libayatana-appindicator3-1 \
            librsvg2-dev patchelf pkg-config git python3 curl unzip xz-utils docker.io
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /__w/_cargo-integration
          key: integration-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: integration-${{ hashFiles('src-tauri/Cargo.lock') }}-
      - uses: actions/cache@v6
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/ffmpeg.json') }}
      - run: node scripts/fetch-ffmpeg.mjs
      # All non-ignored tests, not a hand-maintained subset. Each shard also checks its
      # trace-level log for secrets, covering the eight suites the old separate check ran.
      - name: Real OpenSSH, serving, deployment, cancellation and no secrets in trace logs
        run: python3 scripts/ci-integration.py --shard ${{ matrix.shard }} --shards 8
      - name: No leaked containers or networks
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 15); do
            left="$(
              {
                docker ps -a --filter ancestor=vrcast-test-sshd:5 --format '{{.Names}} {{.Status}}'
                docker ps -a --filter name=vrcast-deploy-target --format '{{.Names}} {{.Status}}'
                docker network ls --format '{{.Name}}' | grep -E '^vrcast-(test-net|deploy-target)-' || true
              } | sort -u
            )"
            [ -z "$left" ] && break
            sleep 1
          done
          if [ -n "$left" ]; then
            echo "Leaked resources on this clean machine:" >&2
            echo "$left" >&2
            if [ -s /tmp/vrcast-leaks.log ]; then cat /tmp/vrcast-leaks.log >&2; fi
            exit 1
          fi

  licenses:
    name: Licence compatibility with GPL-3.0
    timeout-minutes: 20
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny --manifest-path src-tauri/Cargo.toml check licenses advisories
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:licenses
      - run: cargo fetch --manifest-path src-tauri/Cargo.toml
      - run: npm run check:third-party

  guards:
    name: Repository and release guards
    timeout-minutes: 10
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Hardcoded servers (FR-004)
        env:
          FORBID_IP: ${{ secrets.FORBID_IP }}
          FORBID_DOMAIN: ${{ secrets.FORBID_DOMAIN }}
        run: bash scripts/check-no-hardcoded-server.sh
      - run: bash scripts/check-version.sh
      - run: bash scripts/check-theme.sh
      - run: bash scripts/check-motion.sh
      - run: bash scripts/check-leak-guard.sh
      - run: bash scripts/test-latest-json.sh
      - run: python3 -m unittest discover -s scripts -p 'test_ci_integration.py'
      # The host can mount the checkout, unlike the old job-container setup.
      - name: Workflow syntax
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -shellcheck= .github/workflows/build.yml .github/workflows/release.yml
      # Deliberately local-only: isolation needs protected files, server reference needs
      # the skill, and carried-over formulas need convert.sh, all outside the repository.
      # Ignored live-server/measurement tests remain ignored: CI never uses owner's servers.
