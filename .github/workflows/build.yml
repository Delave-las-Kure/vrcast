# T005 — building and checking on both target operating systems.
#
# macOS is deliberately absent: deferred by the owner's decision on 2026-08-23 (see spec.md,
# "Out of scope"). Do not add a runner for it — the application is not built for macOS and
# is not claimed to work there.
#
# The file sat in the repository ahead of time and did nothing until a remote was set.

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Interface — style and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # No --passWithNoTests: the whole suite vanishing (a file moved out from under the
      # glob) has to be red rather than indistinguishable from success.
      - run: npm run test
      # A production build: tsc --noEmit does not catch breakage that shows only on a build.
      - run: npm run build

  core:
    name: Core — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # FFmpeg is needed at BUILD time, not only when packaging: the Tauri bundler checks
      # that the bundled programs are there and refuses to build without them. So this step
      # stands in every job that builds the core at all — otherwise even `cargo test` fails.
      #
      # It is cached by the snapshot in scripts/ffmpeg.json: two hundred and eighty megabytes
      # are downloaded once per version and taken ready afterwards. It is also the only place
      # where the fetching script itself is checked on both target systems.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache for the bundled FFmpeg
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/ffmpeg.json') }}
      - name: Put the bundled FFmpeg in place
        run: node scripts/fetch-ffmpeg.mjs

      # Both of the bundled build's abilities the application cannot work without. Checked
      # on each system separately: a build that has them on Windows and not on Linux is a
      # thing that has happened to other projects, and it would show up here as a person's
      # ladder refusing to be measured.
      - name: The bundled FFmpeg can do what is needed
        shell: bash
        run: bash scripts/check-ffmpeg-features.sh
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Core tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  integration:
    name: Integration — a throwaway server in a container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # FFmpeg is needed at BUILD time, not only when packaging: the Tauri bundler checks
      # that the bundled programs are there and refuses to build without them. So this step
      # stands in every job that builds the core at all — otherwise even `cargo test` fails.
      #
      # It is cached by the snapshot in scripts/ffmpeg.json: two hundred and eighty megabytes
      # are downloaded once per version and taken ready afterwards. It is also the only place
      # where the fetching script itself is checked on both target systems.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache for the bundled FFmpeg
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/ffmpeg.json') }}
      - name: Put the bundled FFmpeg in place
        run: node scripts/fetch-ffmpeg.mjs

      # Running on one thread is not optional: each test brings up a container of its own,
      # and a dozen at once only slows things down.
      - name: Tests against a real OpenSSH
        run: >
          cargo test --manifest-path src-tauri/Cargo.toml
          --features integration --test integration -- --test-threads=1
      - name: Make sure the containers cleaned up after themselves
        if: always()
        run: |
          set -o pipefail
          # The image tag must match IMAGE in tests/integration/fixture.rs, and the network
          # prefix must match NETWORK_PREFIX there.
          #
          # With a settling period rather than at once: `docker rm -f` returns as soon as a
          # container is merely marked for removal, and for a second or two it is still in
          # the listing. A check with no settling period caught that on 2026-08-25 — forty
          # four tests passed, the guard announced "1 left" and then showed an empty list.
          # A flickering guard is worse than none: it teaches people to re-run a build
          # without reading it — and one day they will re-run a real leak the same way.
          for _ in $(seq 1 15); do
            # Three sources now (T248). The serving container is looked for by its image;
            # the two deployment ones by their NAME prefix instead — they are rebuilt and
            # re-tagged more often than the serving one, and a guard keyed to a tag stops
            # watching the moment the tag moves, silently and while still going green.
            left="$(docker ps -a --filter ancestor=vrcast-test-sshd:5 --filter name=vrcast-deploy-target --format '{{.ID}} {{.Status}}')"
            [ -z "$left" ] && break
            sleep 1
          done
          if [ -n "$left" ]; then
            echo "dangling containers were left:" >&2
            # Exactly what was counted is printed, rather than a fresh query: otherwise the
            # message and the list disagree and neither can be made sense of — which is
            # precisely what happened that time.
            echo "$left" >&2
            exit 1
          fi
          echo "no containers left"

          # The networks the fixture creates (T149) are watched for in the same way. A
          # leaked network is not harmless: the pool of addresses they are handed out from
          # is finite, and once it runs out no container starts at all — with a message
          # that says nothing about this place.
          for _ in $(seq 1 15); do
            nets="$(docker network ls --filter name=vrcast-test-net --format '{{.Name}}')"
            [ -z "$nets" ] && break
            sleep 1
          done
          if [ -n "$nets" ]; then
            echo "dangling networks were left:" >&2
            echo "$nets" >&2
            exit 1
          fi
          echo "no networks left"

  licenses:
    name: Licence compatibility with GPL-3.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - name: Check the core dependencies' licences
        run: cargo deny --manifest-path src-tauri/Cargo.toml check licenses advisories
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # An ALLOW list, not a deny list. A deny list is compared by exact string match, and
      # enumerating every spelling in it ("AGPL-3.0" against "AGPL-3.0-only") is a race with
      # reality that cannot be won: proved in practice, the old list let "AGPL-3.0-only"
      # through — the very thing it was created for. An allow list errs on the safe side: an
      # unfamiliar licence fails the build, and a person looks at it.
      - name: Check the interface dependencies' licences
        run: >
          npx --yes license-checker-rseidelsohn --production --excludePrivatePackages
          --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;Unlicense;Python-2.0;BlueOak-1.0.0"
      # The list of other people's work has to answer to the dependency tree. Assembled once
      # and forgotten, it looks like an obligation met while not being one — which is worse
      # than a missing file (T106, the GPL obligation).
      # The sources are needed in full: the licence texts are taken from them rather than
      # from a set of templates of our own — many packages hold a copyright holder's name in
      # that file.
      - name: Fetch the core dependencies' sources
        run: cargo fetch --manifest-path src-tauri/Cargo.toml
      - name: Compare the third-party list against the dependency tree
        run: npm run check:third-party

  guards:
    name: Isolation and no hardcoded servers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hardcoded servers (FR-004)
        env:
          FORBID_IP: ${{ secrets.FORBID_IP }}
          FORBID_DOMAIN: ${{ secrets.FORBID_DOMAIN }}
        run: bash scripts/check-no-hardcoded-server.sh
      # T325. Здесь, а не в «Interface», потому что это охранная проверка того же рода:
      # один цвет, поставленный впрямую на экране, который смотрели, — и тёмная тема
      # ломается там, куда заглядывают реже всего.
      - name: Both themes line up
        run: bash scripts/check-theme.sh
      # The isolation check (principle VII) runs locally before a phase is handed over: CI
      # sees only the application's directory, while the protected files live outside the
      # repository.
