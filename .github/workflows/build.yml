# T005 — building and checking on both target operating systems.
#
# macOS is deliberately absent: deferred by the owner's decision on 2026-08-23 (see spec.md,
# "Out of scope"). Do not add a runner for it — the application is not built for macOS and
# is not claimed to work there.
#
# The file sat in the repository ahead of time and did nothing until a remote was set.

name: build

# **Свои исполнители, а не машины GitHub** (решение владельца 2026-08-27: платить за минуты
# не хотим, репозиторий остаётся закрытым).
#
# Что этим потеряно, сказано прямо: обе находки сквозной оснастки пришли от **чужой** машины —
# гонка на машине, где приложение запускается впервые, и несовпадение драйвера с WebView2.
# Исполнитель на машине разработчика таких находок не даёт, и выдавать его зелёный за прежний
# нельзя.
#
# Что осталось: обе платформы по-настоящему (Windows — своя, Linux — WSL2 Ubuntu 22.04),
# контейнерная интеграция через Docker, и разделение «собрано у меня» от «собрано начисто» —
# исполнитель работает в своём каталоге, а не в рабочем дереве.
#
# **Проверки Linux идут в одноразовом контейнере** (`scripts/linux-check/Dockerfile`), и это не
# удобство, а вывод из происшествия. 2026-08-27 задание сделало на своей машине то, что делает
# на машине GitHub: поставило rustup поверх настоящего и унесло `rustup.exe`, а с ним — все
# ссылки в `.cargo/bin`, `cargo-deny` и `tauri-driver`. Ничего не пропало навсегда, но и рисковать
# было нечем.
#
# Контейнер возвращает проверкам то, на чём они и рассчитаны работать: машину, которую выбрасывают.
# Что они там поставят, сломают или оставят — уходит вместе с ней.
#
# **Windows остаётся своей машиной**, и иначе быть не может: сквозная оснастка правит настоящим
# окном, а окна в контейнере Windows нет. Взамен задания там больше ничего не ставят — цепочка
# Rust проверяется, а не устанавливается.
#
# Образ собирается один раз:  docker build -t localhost:5000/vrcast-linux-check:3 scripts/linux-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# **Устаревший прогон отменяется, а не досиживает.**
#
# Исполнитель Linux один, и задания он берёт по очереди: пока идут проверки предыдущего
# коммита, следующий ждёт. Ответ про код, которого уже нет в ветке, при этом никому не нужен —
# а очередь он держит наравне с нужным. Отменяется только прогон той же ветки: чужая ветка
# отвечает на свой вопрос.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Вне выкачиваемого дерева и потому переживает прогоны: у своей машины это заменяет кеш.
  #
  # `github.workspace`, а не `runner.workspace`: в общем блоке `env` доступны только контексты
  # `github`, `inputs`, `secrets` и `vars`, а свойства `workspace` у `runner` нет вовсе. Файл с
  # таким выражением отвергается целиком — прогон падает без единого задания и без причины,
  # которую видно из API. Поймано 2026-08-27, дважды подряд, и только `actionlint` назвал её.
  CARGO_TARGET_DIR: ${{ github.workspace }}/../_cargo-target

jobs:
  frontend:
    name: Interface — style and tests
    timeout-minutes: 30
    runs-on: [self-hosted, vrcast-linux]
    container:
      image: localhost:5000/vrcast-linux-check:3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # No --passWithNoTests: the whole suite vanishing (a file moved out from under the
      # glob) has to be red rather than indistinguishable from success.
      - run: npm run test
      # A production build: tsc --noEmit does not catch breakage that shows only on a build.
      - run: npm run build

  core:
    name: Core — ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # **Контейнер задаётся строкой, а не полем `image`.** Пустое поле `image` файл не
          # принимает вовсе — прогон падает целиком, без единого задания и без внятной
          # причины (поймано 2026-08-27). Пустая же строка на месте всего `container:`
          # означает «без контейнера», и это единственный способ дать контейнер одной ветви
          # матрицы и не дать другой.
          - os: vrcast-win
            container: ""
          - os: vrcast-linux
            container: localhost:5000/vrcast-linux-check:3
    runs-on: [self-hosted, '${{ matrix.os }}']
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4

      - name: Системные библиотеки на месте (Linux)
        if: matrix.os == 'vrcast-linux'
        run: |
          missing=""
          for p in libwebkit2gtk-4.1-dev librsvg2-dev patchelf; do
            dpkg -s "$p" >/dev/null 2>&1 || missing="$missing $p"
          done
          dpkg -s libappindicator3-dev >/dev/null 2>&1 \
            || dpkg -s libayatana-appindicator3-dev >/dev/null 2>&1 \
            || missing="$missing libayatana-appindicator3-dev"
          if [ -n "$missing" ]; then
            echo "На машине исполнителя не хватает:$missing" >&2
            echo "Поставить один раз:  sudo apt-get install -y$missing" >&2
            exit 1
          fi
          echo "системные библиотеки на месте"

      # **Цепочка Rust проверяется, а не ставится.**
      #
      # Прежде здесь стояло `dtolnay/rust-toolchain@stable`, и на машине GitHub это верно: она
      # одноразовая. На своей машине то же действие ставит rustup **поверх настоящего** — и
      # 2026-08-27 оно снесло `rustup.exe` у владельца. Сам инструмент уцелел только потому,
      # что ссылки в `.cargo/bin` смотрят на rustup, а цепочка лежит отдельно; чинилось
      # переустановкой rustup.
      #
      # Зависимости машины — забота машины. Задание говорит, чего не хватает, и не чинит само.
      - name: Цепочка Rust на месте
        shell: bash
        run: |
          missing=""
          for tool in cargo rustc; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          cargo fmt --version >/dev/null 2>&1 || missing="$missing rustfmt"
          cargo clippy --version >/dev/null 2>&1 || missing="$missing clippy"
          if [ -n "$missing" ]; then
            echo "На машине исполнителя не хватает:$missing" >&2
            echo "Поставить:  rustup toolchain install stable --component rustfmt clippy" >&2
            exit 1
          fi
          cargo --version

      # Кеша сборки здесь нет намеренно: у своей машины `~/.cargo` свой и никуда не
      # девается, а действие кеширования вычищает его перед сохранением — то есть лезет в
      # настоящий каталог владельца. Вместо него `CARGO_TARGET_DIR` ниже: он держит сборку
      # между прогонами, но вне рабочего дерева, которое исполнитель перевыкачивает.

      # FFmpeg is needed at BUILD time, not only when packaging: the Tauri bundler checks
      # that the bundled programs are there and refuses to build without them. So this step
      # stands in every job that builds the core at all — otherwise even `cargo test` fails.
      #
      # It is cached by the snapshot in scripts/ffmpeg.json: two hundred and eighty megabytes
      # are downloaded once per version and taken ready afterwards. It is also the only place
      # where the fetching script itself is checked on both target systems.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache for the bundled FFmpeg
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/ffmpeg.json') }}
      - name: Put the bundled FFmpeg in place
        run: node scripts/fetch-ffmpeg.mjs

      # Both of the bundled build's abilities the application cannot work without. Checked
      # on each system separately: a build that has them on Windows and not on Linux is a
      # thing that has happened to other projects, and it would show up here as a person's
      # ladder refusing to be measured.
      - name: The bundled FFmpeg can do what is needed
        shell: bash
        run: bash scripts/check-ffmpeg-features.sh
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Core tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # **The expensive job, and it is kept on every push deliberately** (owner's decision,
  # 2026-08-27). It builds the application for release on both platforms, and Windows minutes
  # bill at double — so everything that can be cached is. What is left uncached is our own
  # crate, which has to be rebuilt to be worth checking.
  #
  # A rarer schedule was the alternative and was turned down: the end-to-end check is already
  # the slowest to run, and made rare as well it finds a breakage days after the change that
  # caused it, when nobody remembers the change.
  e2e:
    name: End to end — the built application, driven
    # **Предел времени, а не бесконечность.** Исполнитель здесь один и настоящий:
    # зависшее задание держит не абстрактную очередь, а машину владельца, и держит её
    # столько, сколько GitHub позволит по умолчанию — шесть часов. Числа взяты с запасом
    # против самого долгого удачного прогона, чтобы предел ловил зависание, а не
    # медленный день.
    timeout-minutes: 60
    runs-on: [self-hosted, '${{ matrix.os }}']
    strategy:
      fail-fast: false
      matrix:
        include:
          # **Контейнер задаётся строкой, а не полем `image`.** Пустое поле `image` файл не
          # принимает вовсе — прогон падает целиком, без единого задания и без внятной
          # причины (поймано 2026-08-27). Пустая же строка на месте всего `container:`
          # означает «без контейнера», и это единственный способ дать контейнер одной ветви
          # матрицы и не дать другой.
          - os: vrcast-win
            container: ""
          - os: vrcast-linux
            container: localhost:5000/vrcast-linux-check:3
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
      # **Цепочка Rust проверяется, а не ставится.**
      #
      # Прежде здесь стояло `dtolnay/rust-toolchain@stable`, и на машине GitHub это верно: она
      # одноразовая. На своей машине то же действие ставит rustup **поверх настоящего** — и
      # 2026-08-27 оно снесло `rustup.exe` у владельца. Сам инструмент уцелел только потому,
      # что ссылки в `.cargo/bin` смотрят на rustup, а цепочка лежит отдельно; чинилось
      # переустановкой rustup.
      #
      # Зависимости машины — забота машины. Задание говорит, чего не хватает, и не чинит само.
      - name: Цепочка Rust на месте
        shell: bash
        run: |
          missing=""
          for tool in cargo rustc; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          cargo fmt --version >/dev/null 2>&1 || missing="$missing rustfmt"
          cargo clippy --version >/dev/null 2>&1 || missing="$missing clippy"
          if [ -n "$missing" ]; then
            echo "На машине исполнителя не хватает:$missing" >&2
            echo "Поставить:  rustup toolchain install stable --component rustfmt clippy" >&2
            exit 1
          fi
          cargo --version
      # Кеша сборки здесь нет намеренно: у своей машины `~/.cargo` свой и никуда не
      # девается, а действие кеширования вычищает его перед сохранением — то есть лезет в
      # настоящий каталог владельца. Вместо него `CARGO_TARGET_DIR` ниже: он держит сборку
      # между прогонами, но вне рабочего дерева, которое исполнитель перевыкачивает.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # `webkit2gtk-driver` gives WebKitWebDriver, which tauri-driver forwards to, and xvfb
      # gives the application somewhere to open its window: a runner has no display, and
      # without one the window never appears and the driver waits for it forever.
      - name: Системные библиотеки и драйвер на месте (Linux)
        if: runner.os == 'Linux'
        run: |
          missing=""
          for p in libwebkit2gtk-4.1-dev librsvg2-dev patchelf webkit2gtk-driver xvfb; do
            dpkg -s "$p" >/dev/null 2>&1 || missing="$missing $p"
          done
          dpkg -s libappindicator3-dev >/dev/null 2>&1 \
            || dpkg -s libayatana-appindicator3-dev >/dev/null 2>&1 \
            || missing="$missing libayatana-appindicator3-dev"
          if [ -n "$missing" ]; then
            echo "На машине исполнителя не хватает:$missing" >&2
            echo "Поставить один раз:  sudo apt-get install -y$missing" >&2
            exit 1
          fi
          echo "системные библиотеки и драйвер на месте"

      - run: npm ci
      - name: Cache for the bundled FFmpeg
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/ffmpeg.json') }}
      - name: Put the bundled FFmpeg in place
        run: node scripts/fetch-ffmpeg.mjs

      # Compiled from source by `cargo install`, and it does not change between pushes: the
      # version is pinned so the cache has something honest to key on. Unpinned, `--locked`
      # still floats to whatever is newest, and the cache would miss on the day it moves —
      # silently, looking like a slow run rather than a new version.
      # Ставится только если его нет: на своей машине `~/.cargo/bin` никуда не девается
      # между прогонами, и кеш здесь был бы и бесполезен, и лез бы в настоящий каталог
      # владельца — ровно то, из-за чего отсюда убрано действие с цепочкой Rust.
      - name: Промежуточный драйвер
        shell: bash
        run: |
          if tauri-driver --help >/dev/null 2>&1; then
            echo "tauri-driver уже на машине"
          else
            cargo install tauri-driver --version 2.0.6 --locked
          fi

      # Twenty megabytes fetched by version. The key carries the runner image's label, because
      # that is what moves the webview version — and when it moves, the driver has to move
      # with it or refuse to attach.
      - name: Cache for the platform WebDriver
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: src-tauri/target/webdriver
          key: webdriver-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-webdriver.mjs') }}

      # What the harness actually drives is a WebView2, and the runner's image says nothing
      # about whether the runtime is there. Printed rather than assumed: the first run of this
      # job failed on Windows with "DevToolsActivePort file doesn't exist", which is what a
      # missing or mismatched runtime looks like from the driver's side.
      - name: What webview is on this machine (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $keys = @{
            'WebView2 (machine, 32)' = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
            'WebView2 (machine)'     = 'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
            'WebView2 (user)'        = 'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
            'Edge'                   = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{56EB18F8-B008-4CBD-B6D2-8C97FE7E9062}'
          }
          foreach ($k in $keys.GetEnumerator()) {
            if (Test-Path $k.Value) { "$($k.Key): $((Get-ItemProperty $k.Value).pv)" }
            else { "$($k.Key): not registered" }
          }

      # **`--features custom-protocol` is not optional, and not what it looks like.** What
      # takes a Tauri binary out of development mode is that feature, not the release
      # profile: its own build script reads `dev = !custom_protocol`. Without it the window
      # opens on the dev server's address with nothing there, the harness drives the
      # browser's error page, and every check fails for a reason that has nothing to do with
      # the application. Found on the harness's first run, 2026-08-27.
      - name: Build the frontend and the application
        run: |
          npm run build
          cargo build --release --features custom-protocol --manifest-path src-tauri/Cargo.toml

      - name: Drive it (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e
      # **Экран поднимается вручную, а не через `xvfb-run`.** Тот запускает Xvfb и ждёт от
      # него сигнала готовности — и в этом образе не дожидается никогда: команда висит до
      # упора, ничего не сказав. Сам Xvfb при этом работает, гнездо экрана появляется за
      # секунду. Проверено 2026-08-27; ждать сигнала, которого нет, — не та задача, ради
      # которой стоит держать посредника.
      - name: Drive it (Linux)
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp &
          export DISPLAY=:99
          # Ждём именно гнездо, а не «немного»: пауза наугад либо коротка на нагруженной
          # машине, либо тратит время на всех остальных.
          for _ in $(seq 1 30); do
            [ -e /tmp/.X11-unix/X99 ] && break
            sleep 1
          done
          if [ ! -e /tmp/.X11-unix/X99 ]; then
            echo "экран так и не поднялся за 30 с" >&2
            exit 1
          fi
          npm run test:e2e

  integration:
    name: Integration — a throwaway server in a container
    # **Предел времени, а не бесконечность.** Исполнитель здесь один и настоящий:
    # зависшее задание держит не абстрактную очередь, а машину владельца, и держит её
    # столько, сколько GitHub позволит по умолчанию — шесть часов. Числа взяты с запасом
    # против самого долгого удачного прогона, чтобы предел ловил зависание, а не
    # медленный день.
    timeout-minutes: 90
    runs-on: [self-hosted, vrcast-linux]
    container:
      image: localhost:5000/vrcast-linux-check:3
      # **Демон машины, но не её сеть.** Сокет — чтобы поднимать контейнеры на том же
      # демоне, а не заводить демон внутри демона. А вот `--network host` отдать нельзя:
      # исполнитель ведёт для задания-контейнера свою сеть и при попытке разделить сеть
      # машины не создаёт контейнер вовсе, отвечая «Value cannot be null. (Parameter
      # 'ContainerId')».
      #
      # Поэтому опубликованные порты достаются по имени, которое Docker Desktop заводит для
      # машины, — см. `VRCAST_TEST_HOST` ниже и `TestServer::host`.
      options: -v /var/run/docker.sock:/var/run/docker.sock
    steps:
      - uses: actions/checkout@v4
      # **Цепочка Rust проверяется, а не ставится.**
      #
      # Прежде здесь стояло `dtolnay/rust-toolchain@stable`, и на машине GitHub это верно: она
      # одноразовая. На своей машине то же действие ставит rustup **поверх настоящего** — и
      # 2026-08-27 оно снесло `rustup.exe` у владельца. Сам инструмент уцелел только потому,
      # что ссылки в `.cargo/bin` смотрят на rustup, а цепочка лежит отдельно; чинилось
      # переустановкой rustup.
      #
      # Зависимости машины — забота машины. Задание говорит, чего не хватает, и не чинит само.
      - name: Цепочка Rust на месте
        shell: bash
        run: |
          missing=""
          for tool in cargo rustc; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          cargo fmt --version >/dev/null 2>&1 || missing="$missing rustfmt"
          cargo clippy --version >/dev/null 2>&1 || missing="$missing clippy"
          if [ -n "$missing" ]; then
            echo "На машине исполнителя не хватает:$missing" >&2
            echo "Поставить:  rustup toolchain install stable --component rustfmt clippy" >&2
            exit 1
          fi
          cargo --version
      # Кеша сборки здесь нет намеренно: у своей машины `~/.cargo` свой и никуда не
      # девается, а действие кеширования вычищает его перед сохранением — то есть лезет в
      # настоящий каталог владельца. Вместо него `CARGO_TARGET_DIR` ниже: он держит сборку
      # между прогонами, но вне рабочего дерева, которое исполнитель перевыкачивает.
      - name: Системные библиотеки на месте
        run: |
          missing=""
          for p in libwebkit2gtk-4.1-dev librsvg2-dev patchelf; do
            dpkg -s "$p" >/dev/null 2>&1 || missing="$missing $p"
          done
          dpkg -s libappindicator3-dev >/dev/null 2>&1 \
            || dpkg -s libayatana-appindicator3-dev >/dev/null 2>&1 \
            || missing="$missing libayatana-appindicator3-dev"
          if [ -n "$missing" ]; then
            echo "На машине исполнителя не хватает:$missing" >&2
            echo "Поставить один раз:  sudo apt-get install -y$missing" >&2
            exit 1
          fi
          echo "системные библиотеки на месте"
      # FFmpeg is needed at BUILD time, not only when packaging: the Tauri bundler checks
      # that the bundled programs are there and refuses to build without them. So this step
      # stands in every job that builds the core at all — otherwise even `cargo test` fails.
      #
      # It is cached by the snapshot in scripts/ffmpeg.json: two hundred and eighty megabytes
      # are downloaded once per version and taken ready afterwards. It is also the only place
      # where the fetching script itself is checked on both target systems.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache for the bundled FFmpeg
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/ffmpeg.json') }}
      - name: Put the bundled FFmpeg in place
        run: node scripts/fetch-ffmpeg.mjs

      # Running on one thread is not optional: each test brings up a container of its own,
      # and a dozen at once only slows things down.
      # Адрес заданию больше не называется. Фикстура сама узнаёт, что работает в контейнере,
      # подключает его к сети стенда и ходит к серверу по имени — ни петля машины, ни
      # `host.docker.internal` для этого не годятся: порты публикуются на петлю нарочно, а
      # петлю одного контейнера из другого не достать. Проверено 2026-08-28.
      - name: Tests against a real OpenSSH
        run: >
          cargo test --manifest-path src-tauri/Cargo.toml
          --features integration --test integration -- --test-threads=1
      - name: Make sure the containers cleaned up after themselves
        if: always()
        # **Оболочка названа, а не взята по умолчанию.** В задании-контейнере по умолчанию
        # достаётся `sh`, а `set -o pipefail` в нём не существует: шаг падал на первой же
        # строке с «Illegal option -o pipefail», и это выглядело как оставшиеся контейнеры.
        # Так было с самого перехода в контейнер — просто до 2026-08-28 эту ошибку закрывала
        # неудача самих проверок.
        shell: bash
        run: |
          set -o pipefail
          # The image tag must match IMAGE in tests/integration/fixture.rs, and the network
          # prefix must match NETWORK_PREFIX there.
          #
          # With a settling period rather than at once: `docker rm -f` returns as soon as a
          # container is merely marked for removal, and for a second or two it is still in
          # the listing. A check with no settling period caught that on 2026-08-25 — forty
          # four tests passed, the guard announced "1 left" and then showed an empty list.
          # A flickering guard is worse than none: it teaches people to re-run a build
          # without reading it — and one day they will re-run a real leak the same way.
          for _ in $(seq 1 15); do
            # Three sources now (T248). The serving container is looked for by its image;
            # the two deployment ones by their NAME prefix instead — they are rebuilt and
            # re-tagged more often than the serving one, and a guard keyed to a tag stops
            # watching the moment the tag moves, silently and while still going green.
            left="$(docker ps -a --filter ancestor=vrcast-test-sshd:5 --filter name=vrcast-deploy-target --format '{{.ID}} {{.Status}}')"
            [ -z "$left" ] && break
            sleep 1
          done
          if [ -n "$left" ]; then
            echo "dangling containers were left:" >&2
            # Exactly what was counted is printed, rather than a fresh query: otherwise the
            # message and the list disagree and neither can be made sense of — which is
            # precisely what happened that time.
            echo "$left" >&2
            exit 1
          fi
          echo "no containers left"

          # The networks the fixture creates (T149) are watched for in the same way. A
          # leaked network is not harmless: the pool of addresses they are handed out from
          # is finite, and once it runs out no container starts at all — with a message
          # that says nothing about this place.
          for _ in $(seq 1 15); do
            nets="$(docker network ls --filter name=vrcast-test-net --format '{{.Name}}')"
            [ -z "$nets" ] && break
            sleep 1
          done
          if [ -n "$nets" ]; then
            echo "dangling networks were left:" >&2
            echo "$nets" >&2
            exit 1
          fi
          echo "no networks left"

  licenses:
    name: Licence compatibility with GPL-3.0
    runs-on: [self-hosted, vrcast-linux]
    container:
      image: localhost:5000/vrcast-linux-check:3
    steps:
      - uses: actions/checkout@v4
      # **Цепочка Rust проверяется, а не ставится.**
      #
      # Прежде здесь стояло `dtolnay/rust-toolchain@stable`, и на машине GitHub это верно: она
      # одноразовая. На своей машине то же действие ставит rustup **поверх настоящего** — и
      # 2026-08-27 оно снесло `rustup.exe` у владельца. Сам инструмент уцелел только потому,
      # что ссылки в `.cargo/bin` смотрят на rustup, а цепочка лежит отдельно; чинилось
      # переустановкой rustup.
      #
      # Зависимости машины — забота машины. Задание говорит, чего не хватает, и не чинит само.
      - name: Цепочка Rust на месте
        shell: bash
        run: |
          missing=""
          for tool in cargo rustc; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          cargo fmt --version >/dev/null 2>&1 || missing="$missing rustfmt"
          cargo clippy --version >/dev/null 2>&1 || missing="$missing clippy"
          if [ -n "$missing" ]; then
            echo "На машине исполнителя не хватает:$missing" >&2
            echo "Поставить:  rustup toolchain install stable --component rustfmt clippy" >&2
            exit 1
          fi
          cargo --version
      - uses: taiki-e/install-action@cargo-deny
      - name: Check the core dependencies' licences
        run: cargo deny --manifest-path src-tauri/Cargo.toml check licenses advisories
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # An ALLOW list, not a deny list. A deny list is compared by exact string match, and
      # enumerating every spelling in it ("AGPL-3.0" against "AGPL-3.0-only") is a race with
      # reality that cannot be won: proved in practice, the old list let "AGPL-3.0-only"
      # through — the very thing it was created for. An allow list errs on the safe side: an
      # unfamiliar licence fails the build, and a person looks at it.
      - name: Check the interface dependencies' licences
        run: >
          npx --yes license-checker-rseidelsohn --production --excludePrivatePackages
          --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;Unlicense;Python-2.0;BlueOak-1.0.0"
      # The list of other people's work has to answer to the dependency tree. Assembled once
      # and forgotten, it looks like an obligation met while not being one — which is worse
      # than a missing file (T106, the GPL obligation).
      # The sources are needed in full: the licence texts are taken from them rather than
      # from a set of templates of our own — many packages hold a copyright holder's name in
      # that file.
      - name: Fetch the core dependencies' sources
        run: cargo fetch --manifest-path src-tauri/Cargo.toml
      - name: Compare the third-party list against the dependency tree
        run: npm run check:third-party

  guards:
    name: Isolation and no hardcoded servers
    runs-on: [self-hosted, vrcast-linux]
    container:
      image: localhost:5000/vrcast-linux-check:3
    steps:
      - uses: actions/checkout@v4
      - name: Hardcoded servers (FR-004)
        env:
          FORBID_IP: ${{ secrets.FORBID_IP }}
          FORBID_DOMAIN: ${{ secrets.FORBID_DOMAIN }}
        run: bash scripts/check-no-hardcoded-server.sh
      # T325. Здесь, а не в «Interface», потому что это охранная проверка того же рода:
      # один цвет, поставленный впрямую на экране, который смотрели, — и тёмная тема
      # ломается там, куда заглядывают реже всего.
      - name: The version is in one place
        # T341. Here for the same reason as its neighbours: two copies of one number drift
        # apart silently, and the drift is visible only to whoever opens both files.
        run: bash scripts/check-version.sh
      - name: Both themes line up
        run: bash scripts/check-theme.sh
      # The isolation check (principle VII) runs locally before a phase is handed over: CI
      # sees only the application's directory, while the protected files live outside the
      # repository.
